<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Kiosko</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        <header>
            <h1 class="text-center">Proyecto Kiosko</h1>
        </header>
        <main>
            <div class="container mt-5 w-50">
                <h3 class="text-center">Listado de Productos</h3>
                <ul id="listado-productos" class="list-group card p-3">                  
                </ul>
            </div>
            <form class="container mt-5 w-50" id="formulario">
                <h3 class="text-center">Cargar Producto</h3>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del Producto</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingrese el nombre del producto">
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Descripcion</label>
                    <input type="text" class="form-control" id="descripcion"  placeholder="Ingrese la descripcion del producto">
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Precio</label>
                    <input type="number" min="0.01" step="0.01" class="form-control" id="precio" placeholder="Ingrese el precio del producto">
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Stock</label>
                    <input type="number" min="0" step="1" class="form-control" id="stock" placeholder="Ingrese el stock del producto">
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Categoria</label>
                    <input type="text" class="form-control" id="categoria"  placeholder="Ingrese la categoria del producto">
                </div>
                <button type="submit" class="btn-solid theme-primary m-auto">Cargar</button>
            </form>
        </main>
    </body>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script type="module" src="./js/main.js"></script>
</html>
